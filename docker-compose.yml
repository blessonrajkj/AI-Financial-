version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pariview_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kjbb2320}
      POSTGRES_DB: ${POSTGRES_DB:-pariview}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pariview}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pariview_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kjbb2320}@postgres:5432/${POSTGRES_DB:-pariview}
      POSTGRES_SERVER: postgres
      SECRET_KEY: ${SECRET_KEY:-supersecretkeychangeinproduction1234567890}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pariview_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: pariview_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pariviewadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pariviewsecret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
