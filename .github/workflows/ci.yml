name: PariView Production Automated Quality Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Linters & Check Syntax
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pycodestyle
          # Compile all backend python files to verify syntax
          python -m compileall backend/app backend/tests
          # Lint backend for syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Code & Build Verification
        run: |
          cd frontend
          npm ci
          npm run build

  backend-and-db-tests:
    name: Backend Pytest & PostgreSQL Migrations
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pariview
          POSTGRES_PASSWORD: pariviewpassword
          POSTGRES_DB: pariview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for OCR & PDF Parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Sanitized Test Fixtures
        run: |
          python backend/scripts/generate_fixtures.py

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql://pariview:pariviewpassword@localhost:5432/pariview_test
          SECRET_KEY: ci_test_secret_key_1234567890
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Backend Test Suite
        env:
          DATABASE_URL: postgresql://pariview:pariviewpassword@localhost:5432/pariview_test
          SECRET_KEY: ci_test_secret_key_1234567890
        run: |
          cd backend
          pytest -v --tb=short

  e2e-tests:
    name: Playwright End-to-End Workflow Tests
    runs-on: ubuntu-latest
    needs: backend-and-db-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pariview
          POSTGRES_PASSWORD: pariviewpassword
          POSTGRES_DB: pariview_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt uvicorn

      - name: Run Alembic Migrations for E2E
        env:
          DATABASE_URL: postgresql://pariview:pariviewpassword@localhost:5432/pariview_e2e
          SECRET_KEY: e2e_test_secret_key_1234567890
        run: |
          cd backend
          alembic upgrade head

      - name: Start FastAPI Backend Uvicorn Server
        env:
          DATABASE_URL: postgresql://pariview:pariviewpassword@localhost:5432/pariview_e2e
          SECRET_KEY: e2e_test_secret_key_1234567890
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 5
          curl http://127.0.0.1:8000/docs || (cat uvicorn.log && exit 1)

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright & Dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          cd frontend
          npx playwright test

  security-and-build:
    name: Security Secret Scan & Production Vite Build
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets & Credentials
        run: |
          # Custom security check for sensitive keys/credentials
          echo "Scanning for exposed secrets..."
          ! grep -rE "(AWS_SECRET_ACCESS_KEY|PRIVATE_KEY|BEGIN RSA PRIVATE KEY|ghp_[A-Za-z0-9]{36})" --exclude-dir={.git,node_modules,dist,.pytest_cache,__pycache__} .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Production Vite Bundle Output
        run: |
          cd frontend
          npm ci
          npm run build
          test -d dist
          test -f dist/index.html

  docker-build:
    name: Docker Configuration Verification
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config || true
